[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairhealth"
version = "0.1.0"
description = "Trustworthy Healthcare AI: federated learning, fairness auditing, and explainability for clinical settings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Farjana Yesmin", email = "farjanayesmin76@gmail.com" }
]
keywords = [
    "healthcare", "fairness", "federated-learning",
    "explainable-ai", "trustworthy-ai", "bangladesh",
    "maternal-health", "differential-privacy"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=1.7",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "shap>=0.42",
    "scikit-fuzzy>=0.4",
]

[project.optional-dependencies]
federated = ["tenseal>=0.3.14"]
nlp       = ["transformers>=4.35", "nltk>=3.8"]
dev       = ["pytest>=7.4", "black>=23.0", "twine>=4.0", "build>=0.10"]

[project.urls]
Homepage      = "https://github.com/Farjana-Yesmin/fairhealth"
Documentation = "https://fairhealth.readthedocs.io"
Repository    = "https://github.com/Farjana-Yesmin/fairhealth"
Issues        = "https://github.com/Farjana-Yesmin/fairhealth/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["fairhealth*"]
